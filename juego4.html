<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego 4: División de Esmeraldas - EducaCraft</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/botones.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/pantalla-carga.css">
    <style>
        .game-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 900px;
            background: rgba(34, 34, 34, 0.9);
            border: 6px solid #4a4a4a;
            border-radius: 12px;
            padding: 25px;
            color: white;
        }

        .emeralds-source {
            display: flex;
            gap: 15px;
            background: #222;
            border: 4px solid #777;
            padding: 15px;
            border-radius: 8px;
            min-height: 80px;
            min-width: 500px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .draggable-emerald {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
            cursor: grab;
            user-select: none;
        }

        .villagers-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            margin-top: 20px;
        }

        .villager-box {
            background: #2d2d2d;
            border: 4px solid #888;
            border-radius: 8px;
            width: 250px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .villager-box img.aldeano-img {
            width: 90px;
            height: auto;
            image-rendering: pixelated;
            margin-bottom: 10px;
        }

        .villager-name {
            font-size: 18px;
            color: #ffff55;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px black;
        }

        .dropzone {
            background: #151515;
            border: 3px dashed #555;
            width: 200px;
            min-height: 90px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 10px;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }

        .dropzone.hover {
            border-color: #55ff55;
            background: #1c2c1c;
        }

        .dropzone .placed-emerald {
            width: 36px;
            height: 36px;
            image-rendering: pixelated;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body class="fondo-minecraft">

    <div class="game-container">
        <h1 class="titulo-mc">Juego 4: Reparto de Esmeraldas 💚</h1>
        <p class="texto-mc">Reparte equitativamente las 8 esmeraldas entre los 2 aldeanos (8 ÷ 2). ¡Arrastra las esmeraldas!</p>

        <!-- Contenedor con las 8 esmeraldas -->
        <div class="emeralds-source" id="emeraldsSource">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em1" alt="Esmeralda">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em2" alt="Esmeralda">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em3" alt="Esmeralda">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em4" alt="Esmeralda">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em5" alt="Esmeralda">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em6" alt="Esmeralda">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em7" alt="Esmeralda">
            <img src="img/esmeralda.png" class="draggable-emerald" draggable="true" id="em8" alt="Esmeralda">
        </div>

        <div class="villagers-container">
            <!-- Aldeano 1 -->
            <div class="villager-box" id="vbox1">
                <img src="img/aldeano.png" class="aldeano-img" alt="Aldeano 1">
                <span class="villager-name">Aldeano 1</span>
                <div class="dropzone" id="dropzone1" data-id="1"></div>
            </div>

            <!-- Aldeano 2 -->
            <div class="villager-box" id="vbox2">
                <img src="img/aldeano.png" class="aldeano-img" alt="Aldeano 2">
                <span class="villager-name">Aldeano 2</span>
                <div class="dropzone" id="dropzone2" data-id="2"></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="boton-mc" onclick="reiniciarJuego()">Reiniciar</button>
            <button class="boton-mc" onclick="verificarReparto()">Verificar</button>
            <button class="boton-mc" id="btnSiguiente" disabled onclick="irASiguienteJuego()">Siguiente →</button>
        </div>
    </div>

    <!-- HUD XP -->
    <div class="hud-xp">
        <div class="xp-level" id="xpLevel">1</div>
        <div class="xp-bar-container">
            <img src="img/experience_bar_background.png" class="xp-bar-bg">
            <div class="xp-bar-fill" id="xpFill">
                <img src="img/experience_bar_progress.png" class="xp-bar-progress">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/juego4.js"></script>
    <script src="js/musica.js"></script>
    <script src="js/pantalla-carga.js"></script>
</body>
</html>
