<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida</title>

    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/botones.css">
    <link rel="stylesheet" href="css/bienvenida.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/pantalla-carga.css">
</head>
<body>

<div id="panorama"></div>

<div class="container">
    <h1 id="titulo"></h1>

    <img id="avatarMostrado" src="" alt="Avatar" class="avatar-final">

    <h2 id="mensajeBienvenida"></h2>

    <button class="boton" onclick="clickYIr(irActividad)">Comenzar Actividad</button>
    <a href="basico4.html" class="boton boton-enlace" onclick="clickYRedireccionar(event, 'basico4.html')">4° Básico</a>
    <button class="boton" onclick="clickYIr(volver)">Volver</button>
</div>

<script>
    let nombre = localStorage.getItem("nombreUsuario");
    let avatar = localStorage.getItem("avatarUsuario");

    document.getElementById("titulo").innerHTML = "Hola " + nombre + " 👋";
    document.getElementById("avatarMostrado").src = "img/" + avatar;
    document.getElementById("mensajeBienvenida").innerHTML =
    "Bienvenido " + nombre + ", ¿estás listo para aprender? 📚✨";

    // Inicializar sonido de click y forzar precarga
    let sonidoClick = new Audio("sonidos/click.mp3");
    sonidoClick.preload = "auto";
    sonidoClick.load();

    function clickYIr(callback) {
        sonidoClick.currentTime = 0;
        sonidoClick.play().catch(() => {});
        setTimeout(callback, 350);
    }

    function clickYRedireccionar(event, url) {
        event.preventDefault();
        sonidoClick.currentTime = 0;
        sonidoClick.play().catch(() => {});
        setTimeout(() => {
            window.location.href = url;
        }, 350);
    }

    function irActividad() {
        window.location.href = "actividad2.html";
    }

    function volver() {
        window.location.href = "index.html";
    }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/panorama.js"></script>
<script src="js/musica.js"></script>
<script src="js/pantalla-carga.js"></script>
</body>
</html>
