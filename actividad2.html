<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2 - Contemos con Manzanas</title>

    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/botones.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/actividad2.css">

</head>

<body class="fondo-minecraft">

<div class="inventario">

    <h1 class="titulo-mc">🍎 Aprendamos a contar del 1 al 5</h1>

    <p id="instruccion" class="texto-mc">
        Presiona comenzar para iniciar la actividad
    </p>

    <div class="zona-item">
        <img src="img/manzana.png" class="manzana-grande" alt="Manzana">
    </div>

    <div class="zona-manzanas" id="zonaManzanas"></div>

    <button id="btnComenzar" class="boton-mc" onclick="comenzar()">Comenzar</button>

    <div id="mensaje" class="mensaje-mc"></div>

    <!-- BOTONES FINALES -->
    <div id="opcionesFinal" style="display:none; margin-top:20px;">
        <button class="boton-mc" onclick="reiniciarActividad()" 
            onmouseenter="hablar('¿Quieres volver a contar del uno al cinco?')">
            Volver a contar
        </button>

        <button class="boton-mc" onclick="salirBienvenida()" 
            onmouseenter="hablar('¿Quieres volver al menú principal?')">
            Volver al menú
        </button>
        <button class="boton-mc" onclick="irActividad3()"
            onmouseenter="hablar('¿Quieres pasar al siguiente nivel del cofre?')">
            Siguiente nivel
        </button>
    </div>

</div>

<!-- HUD XP Minecraft -->
<div class="hud-xp">
    <div id="xpLevel" class="xp-level">0</div>

    <div class="xp-bar-container">
        <img src="img/experience_bar_background.png" class="xp-bar-bg">

        <div class="xp-bar-fill" id="xpFill">
            <img src="img/experience_bar_progress.png" class="xp-bar-progress">
        </div>
    </div>
</div>

<script src="js/actividad2.js"></script>

<script src="js/musica.js"></script>
</body>
</html>
