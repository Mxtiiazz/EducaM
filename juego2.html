<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego 2: Resta de Manzanas - EducaCraft</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/botones.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/pantalla-carga.css">
    <style>
        .game-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 800px;
            background: rgba(34, 34, 34, 0.9);
            border: 6px solid #4a4a4a;
            border-radius: 12px;
            padding: 30px;
            color: white;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .draggable-card {
            background: #3c3c3c;
            border: 4px solid #777;
            border-bottom-color: #1a1a1a;
            border-right-color: #1a1a1a;
            padding: 15px 25px;
            font-size: 24px;
            color: #ff5555;
            cursor: grab;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 2px 2px 0px black;
        }

        .draggable-card img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }

        .targets-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-top: 30px;
        }

        .drop-target {
            background: #222;
            border: 4px dashed #555;
            width: 150px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 8px;
            position: relative;
        }

        .drop-target.hover {
            border-color: #ff5555;
            background: #3a2a2a;
        }

        .drop-target img {
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
        }

        .drop-target .result-label {
            font-size: 28px;
            color: #ffff55;
            margin-top: 10px;
            text-shadow: 2px 2px 0px black;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body class="fondo-minecraft">

    <div class="game-container">
        <h1 class="titulo-mc">Juego 2: Resta de Manzanas 🍎</h1>
        <p class="texto-mc">¡Arrastra las operaciones de resta al cofre con el resultado correcto!</p>

        <div class="cards-container" id="cardsContainer">
            <div class="draggable-card" draggable="true" id="card1" data-op="8 - 3" data-res="5">
                <img src="img/manzana.png" alt="Manzana">
                <span>8 - 3</span>
            </div>
            <div class="draggable-card" draggable="true" id="card2" data-op="9 - 2" data-res="7">
                <img src="img/manzana.png" alt="Manzana">
                <span>9 - 2</span>
            </div>
            <div class="draggable-card" draggable="true" id="card3" data-op="6 - 4" data-res="2">
                <img src="img/manzana.png" alt="Manzana">
                <span>6 - 4</span>
            </div>
        </div>

        <div class="targets-container">
            <div class="drop-target" id="target2" data-res="2">
                <img src="img/cofre_cerrado.png" alt="Cofre">
                <span class="result-label">2</span>
            </div>
            <div class="drop-target" id="target5" data-res="5">
                <img src="img/cofre_cerrado.png" alt="Cofre">
                <span class="result-label">5</span>
            </div>
            <div class="drop-target" id="target7" data-res="7">
                <img src="img/cofre_cerrado.png" alt="Cofre">
                <span class="result-label">7</span>
            </div>
        </div>

        <div class="btn-container">
            <button class="boton-mc" onclick="reiniciarJuego()">Reiniciar</button>
            <button class="boton-mc" id="btnSiguiente" disabled onclick="irASiguienteJuego()">Siguiente →</button>
        </div>
    </div>

    <!-- HUD XP -->
    <div class="hud-xp">
        <div class="xp-level" id="xpLevel">1</div>
        <div class="xp-bar-container">
            <img src="img/experience_bar_background.png" class="xp-bar-bg">
            <div class="xp-bar-fill" id="xpFill">
                <img src="img/experience_bar_progress.png" class="xp-bar-progress">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="js/juego2.js"></script>
    <script src="js/musica.js"></script>
    <script src="js/pantalla-carga.js"></script>
</body>
</html>
